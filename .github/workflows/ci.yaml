name: Build Hypoland

# the web page (Cloudflare Pages deploys it) and text-only changes need no build
on:
  push:
    paths-ignore:
      - 'web/**'
      - 'scripts/web/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'web/**'
      - 'scripts/web/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
jobs:
  gcc:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    name: "Build Hypoland (Arch)"
    runs-on: ubuntu-latest
    container:
      image: archlinux
    steps:
      - name: Checkout repository actions
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions

      - name: Setup base
        uses: ./.github/actions/setup_base
        with:
          INSTALL_XORG_PKGS: true

      - name: Build Hypoland
        run: |
          CFLAGS=-Werror CXXFLAGS=-Werror make nopch

      - name: Compress and package artifacts
        run: |
          mkdir hypoland
          cp ./LICENSE hypoland/
          cp build/hypoland hypoland/
          cp build/hyprctl/hyprctl hypoland/
          cp -r example/ hypoland/
          cp -r assets/ hypoland/
          tar -cvJf hypoland.tar.xz hypoland

      - name: Release
        uses: actions/upload-artifact@v7
        with:
          name: Build archive
          path: hypoland.tar.xz

  unit-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    name: "Unit tests"
    runs-on: ubuntu-latest
    container:
      image: archlinux
    steps:
      - name: Checkout repository actions
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions

      - name: Setup base
        uses: ./.github/actions/setup_base

      # a build of its own: WITH_TESTS also builds the compositor with coverage
      - name: Build unit tests
        run: |
          cmake --no-warn-unused-cli -DCMAKE_BUILD_TYPE:STRING=Release -DWITH_TESTS=ON -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -S . -B ./build-tests
          cmake --build ./build-tests --target hyprland_gtests -j`nproc 2>/dev/null || getconf NPROCESSORS_CONF`

      - name: Run unit tests
        run: ./build-tests/hyprland_gtests

  clang-format:
    permissions: read-all
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    name: "Code Style"
    runs-on: ubuntu-latest
    container:
      image: archlinux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install clang-format
        run: |
          pacman --noconfirm --noprogressbar -Syyu
          pacman --noconfirm --noprogressbar -Sy clang

      - name: clang-format check
        run: .github/workflows/clang-format-check.sh "." "llvm" "^subprojects$" ""

      - name: Save PR head commit SHA
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          echo "SHA=$SHA" >> $GITHUB_ENV
      - name: Save latest commit SHA if not PR
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        run: echo "SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Report failure in job summary
        if: failure()
        run: |
          DEEPLINK="${{ github.server_url }}/${{ github.repository }}/commit/${{ env.SHA }}"
          echo -e "Format check failed on commit [${GITHUB_SHA:0:8}]($DEEPLINK) with files:\n$(<$GITHUB_WORKSPACE/failing-files.txt)" >> $GITHUB_STEP_SUMMARY

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Hypoland</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#efe6d2">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<style>
:root {
  --desk: #efe6d2;
  --dot: #e0d4b8;
  --paper: #fffdf7;
  --ink: #22252b;
  --muted: #5b606a;
  --frame: #3a3f48;
  --frame-dim: #8a8f98;
  --potato: #d9a05b;
  --peel: #4a2a10;
  --light: #f2cd98;
  --term: #1d1f23;
  --mono: ui-monospace, "DejaVu Sans Mono", "Liberation Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { background: var(--desk); }
/* Everything is in rem, so the page grows on wide (often high density) screens. */
@media (min-width: 1400px) { html { font-size: 112.5%; } }
@media (min-width: 1800px) { html { font-size: 125%; } }
body {
  margin: 0;
  color: var(--ink);
  font: 1rem/1.55 system-ui, -apple-system, "Segoe UI", "DejaVu Sans", sans-serif;
  background-color: var(--desk);
  background-image: radial-gradient(var(--dot) 1px, transparent 1px);
  background-size: 0.5rem 0.5rem;
  min-height: 100vh;
}
a { color: var(--peel); text-decoration-thickness: 2px; text-underline-offset: 2px; }
.bar {
  display: flex; align-items: center; gap: 0.875rem;
  padding: 0.25rem 0.75rem;
  background: var(--frame); color: #e8e3d8;
  font: 0.8125rem/1.6 var(--mono);
}
.bar a { color: inherit; text-decoration: none; }
.bar a:hover { color: var(--light); }
.desk { max-width: 45rem; margin: 0 auto; padding: 3rem 1rem; }
.win {
  background: var(--term); color: #aaa;
  border: 2px solid #50555e;
  box-shadow: 0.25rem 0.25rem 0 rgba(58, 63, 72, 0.25);
}
.title {
  display: flex; align-items: center; gap: 0.5rem;
  margin: 0; padding: 0.1875rem 0.625rem;
  background: #2c2f35; border-bottom: 2px solid #50555e;
  font: 600 0.8125rem/1.6 var(--mono); color: #c8ccd3;
}
.title:after { content: ""; margin-left: auto; width: 0.625rem; height: 0.625rem; border: 2px solid currentColor; }
pre { margin: 0; padding: 1.125rem 1.25rem 1.375rem; overflow-x: auto; font: 0.8438rem/1.5 var(--mono); }
.w { color: #fff; }
.r { color: #ff5555; }
.p { color: var(--potato); }
.cur { display: inline-block; width: 0.6em; height: 0.2em; background: #aaa; vertical-align: -0.1em; }
@media (prefers-reduced-motion: no-preference) {
  .cur { animation: blink 1.06s steps(1) infinite; }
}
@media (max-width: 480px) {
  pre { padding: 0.875rem 0.75rem 1rem; font-size: 0.7812rem; }
}
@keyframes blink { 50% { visibility: hidden; } }
.buttons { display: flex; flex-wrap: wrap; gap: 0.625rem; justify-content: center; margin-top: 1.5rem; }
.btn {
  display: inline-block; padding: 0.4375rem 1rem;
  font: 600 0.875rem/1.4 var(--mono); text-decoration: none;
  color: var(--peel); background: var(--potato);
  border: 2px solid var(--peel); box-shadow: 0.1875rem 0.1875rem 0 var(--peel);
}
.btn:hover { background: var(--light); }
.btn:active { transform: translate(0.1875rem, 0.1875rem); box-shadow: none; }
.btn.alt { background: var(--paper); }
</style>
</head>
<body>

<nav class="bar" aria-label="Site">
  <a href="/">hypoland.org</a>
</nav>

<main class="desk">
  <section class="win" aria-labelledby="t">
    <h1 class="title" id="t">foot: 404</h1>
<pre><span class="p">$</span> <span class="w">cat this-page</span>
<span class="r">cat: this-page: No such file or directory</span>

<span class="p">$</span> <span class="w">hyprctl dispatch workspace 1</span>
ok, try the front page instead
<span class="p">$</span> <span class="cur"></span></pre>
  </section>

  <div class="buttons">
    <a class="btn" href="/">Go to hypoland.org</a>
    <a class="btn alt" href="https://github.com/hegjon/hypoland">Source on GitHub</a>
  </div>
</main>

</body>
</html>
